version: 1
project:
  name: keir-core
workRecord:
  backend: local
  local:
    taskPath: ".agent-workflow/tasks/{slug}.md"
  requiredForBranchChanges: true
redline: required
redlineVerdictPath: build/redline-verdict.json
applicability:
  documentationOnly:
    paths:
      - roadmap/
      - docs/
      - README.md
      - CONTRIBUTING.md
    workflowRequired: false
    directDefaultBranchAllowed: false
