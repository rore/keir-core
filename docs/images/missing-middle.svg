<text x="702" y="270" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#F3F3EC">New behavior</text>
<rect x="310" y="50" width="320" height="268" rx="18" fill="#CFFD71"/>
