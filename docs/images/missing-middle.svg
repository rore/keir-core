<text x="60" y="104" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" font-weight="800" fill="#6FD0B0" letter-spacing="1.5">CONFIGURATION</text>
<text x="60" y="140" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#F3F3EC">Safe, but fixed.</text>
<text x="60" y="170" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#A3B5B8">Only the options the</text>
<text x="60" y="190" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#A3B5B8">vendor anticipated.</text>
<text x="60" y="246" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14" font-weight="800" fill="#6FD0B0">✓</text>
<text x="82" y="246" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#F3F3EC">Controlled</text>
<text x="60" y="270" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14" font-weight="800" fill="#6F8C93">✕</text>
<text x="82" y="270" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#6F8C93">New behavior</text>
