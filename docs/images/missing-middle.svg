<text x="680" y="104" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" font-weight="800" fill="#F48B6C" letter-spacing="1.5">CUSTOM CODE</text>
<text x="680" y="138" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#F3F3EC">Flexible, but risky.</text>
