<text x="680" y="104" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" font-weight="800" fill="#F48B6C" letter-spacing="1.5">CUSTOM CODE</text>
<text x="680" y="140" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="19" font-weight="700" fill="#F3F3EC">Flexible, but risky.</text>
<text x="680" y="170" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#A3B5B8">Needs developers and</text>
<text x="680" y="190" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#A3B5B8">ongoing security work.</text>
<text x="680" y="246" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="14" font-weight="800" fill="#6F8C93">✕</text>
