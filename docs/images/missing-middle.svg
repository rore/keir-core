<text x="60" y="168" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#A3B5B8">Only the options the</text>
<text x="60" y="188" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#A3B5B8">vendor anticipated.</text>
<path d="M60 228 H260" stroke="#25393F" stroke-width="1"/>
<path d="M60 251 l3.6 3.6 l7 -7.6" fill="none" stroke="#6FD0B0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="256" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="400" fill="#F3F3EC">Controlled</text>
