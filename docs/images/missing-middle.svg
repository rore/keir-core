<rect x="40" y="74" width="240" height="236" rx="16" fill="#14252B" stroke="#6FD0B0" stroke-opacity=".5" stroke-width="1.5"/>
<text x="60" y="104" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="11" font-weight="800" fill="#6FD0B0" letter-spacing="1.5">CONFIGURATION</text>
