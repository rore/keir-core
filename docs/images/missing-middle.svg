<text x="332" y="184" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="600" fill="#24323A">Business users describe it, AI</text>
<text x="332" y="202" font-family='Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif' font-size="13.5" font-weight="600" fill="#24323A">composes it, the app keeps control.</text>
