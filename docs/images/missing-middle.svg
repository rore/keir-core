<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" width="940" height="360" role="img" aria-labelledby="t d">
<title id="t">The missing middle</title><desc id="d">Configuration is safe but limited to what the vendor anticipated. Custom code is flexible but needs developers and is hard to control. Keir is the middle: new behavior built from the app's own building blocks, by business users with AI, kept within the app's limits.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101C21"/><stop offset="1" stop-color="#0C1519"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#CFFD71" stop-opacity=".15"/><stop offset="1" stop-color="#CFFD71" stop-opacity="0"/></radialGradient></defs>
<rect width="940" height="360" rx="20" fill="url(#bg)"/>
<ellipse cx="470" cy="170" rx="220" ry="150" fill="url(#glow)"/>
