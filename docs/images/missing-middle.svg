<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 368" width="940" height="368" role="img" aria-labelledby="t d">
<title id="t">Keir: the missing middle</title>
<desc id="d">Configuration is safe but fixed: only the options the vendor anticipated. Custom code is flexible but risky: it needs developers and ongoing security work. Keir is the missing middle: new behavior built from the app's own blocks. Business users describe it, AI composes it, and the app keeps control. Customer-defined behavior, platform-defined authority.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101C21"/><stop offset="1" stop-color="#0C1519"/></linearGradient><radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#CFFD71" stop-opacity=".16"/><stop offset="1" stop-color="#CFFD71" stop-opacity="0"/></radialGradient></defs>
<rect width="940" height="368" rx="20" fill="url(#bg)"/>
<ellipse cx="470.0" cy="192.0" rx="250" ry="170" fill="url(#glow)"/>
