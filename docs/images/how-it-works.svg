<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 556" width="940" height="556" role="img" aria-labelledby="t d">
<title id="t">How Keir works</title>
<desc id="d">Before it runs: the app publishes its model; AI writes an extension in the Keir language using only the app's building blocks; the Keir compiler checks it against the model; the app tests and approves the checked extension. When it runs, inside the app: a hook fires, the Keir runtime runs the activated extension within a budget and deadline and calls the app's operations, and the app's services perform every effect under the app's own permissions.</desc>
