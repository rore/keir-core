version: 1
project:
  name: keir-core
zones:
  red:
    - path: agent-workflow.yaml
      reason: workflow policy changes
      checkpoint: architecture-review
    - path: agent-redline-policy.yaml
      reason: risk policy changes
      checkpoint: architecture-review
  blue:
    - path: roadmap/**
      reason: shared planning updates
    - path: docs/**
      reason: documentation-only work, including design and specification text
    - path: README.md
      reason: project documentation
    - path: CONTRIBUTING.md
      reason: contributor documentation
checkpoints:
  architecture-review:
    description: Review structural policy or decision changes
    satisfiedBy:
      - label: architecture-reviewed
modes:
  default: shadow
excludes:
  - ".agent-workflow/**"
