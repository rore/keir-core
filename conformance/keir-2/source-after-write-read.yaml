language: keir/2
domain: {id: sample.tasks, version: '4', fingerprint: 'sha256:ec3491e83989576b242cfd5ab9f943304629bde86ac4c81358b7d64f5500ea49'}
entrypoint: TaskCompleted
name: follow-up-in-selected-project
steps:
  - id: eligibleProject
    let: {literal: 'project1', type: ProjectId}
  - id: source
    call: tasks.get
    args:
      taskId: {cel: input.taskId}
  - id: eligible
    let: {cel: 'source.status == "COMPLETED" && source.projectId == eligibleProject'}
  - id: created
    call: tasks.create
    when: eligible
    args:
      projectId: {cel: eligibleProject}
      title: {literal: 'Follow up'}
  - id: afterWrite
    call: tasks.get
    args:
      taskId: {cel: input.taskId}
return:
  record:
    status: {cel: 'eligible ? "CREATED" : "NO_OP"'}
