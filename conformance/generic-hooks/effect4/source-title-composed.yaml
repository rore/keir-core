language: keir/v0
domain: {id: sample.tasks, version: '4-title', fingerprint: 'sha256:bf0c4e8138eccbee6cbce4e9968bf30b3e41be757ccc600d3813de00403c5d59'}
entrypoint: TaskCompleted
name: follow-up-with-composed-title
steps:
  - id: eligibleProject
    let: {literal: 'project1', type: ProjectId}
  - id: source
    call: tasks.get
    args:
      taskId: {cel: input.taskId}
  - id: eligible
    let: {cel: 'source.status == "COMPLETED" && !(source.title + "!" == "Other title")'}
  - id: created
    call: tasks.create
    when: eligible
    args:
      projectId: {cel: eligibleProject}
      title: {cel: 'source.projectId == eligibleProject ? "Valid title" : source.title + "!"'}
return:
  record:
    status: {cel: 'eligible ? "CREATED" : "NO_OP"'}
