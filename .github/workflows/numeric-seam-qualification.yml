name: Bounded numeric engine qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numeric-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAVEN_OPTS: -Xmx256m
    steps:
      - name: Create new runner-temporary roots
        shell: bash
        timeout-minutes: 1
        env:
          NUMERIC_ROOT: ${{ runner.temp }}/keir-numeric-${{ github.run_id }}-${{ github.run_attempt }}
          MAVEN_USER_HOME: ${{ runner.temp }}/keir-numeric-${{ github.run_id }}-${{ github.run_attempt }}/maven
          NPM_CONFIG_CACHE: ${{ runner.temp }}/keir-numeric-${{ github.run_id }}-${{ github.run_attempt }}/npm-cache
          TMPDIR: ${{ runner.temp }}/keir-numeric-${{ github.run_id }}-${{ github.run_attempt }}/tmp
        run: |
          set -euo pipefail
          test ! -e "$NUMERIC_ROOT"
          mkdir -p "$NUMERIC_ROOT"/{maven,npm-cache,tmp,logs,output,evidence}
          printf '%s\n' "NUMERIC_ROOT=$NUMERIC_ROOT" "MAVEN_USER_HOME=$MAVEN_USER_HOME" \
            "NPM_CONFIG_CACHE=$NPM_CONFIG_CACHE" "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        timeout-minutes: 2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact committed input
        shell: bash
        timeout-minutes: 1
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-java@v6
        timeout-minutes: 3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        timeout-minutes: 3
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Resolve pinned dependencies and build only the standalone probe
        id: setup
        timeout-minutes: 17
        shell: bash
        run: node conformance/cel-profile/numeric.mjs setup
      - name: One bounded Java-to-Node numeric workload
        id: workload
        timeout-minutes: 3
        shell: bash
        run: node --max-old-space-size=256 conformance/cel-profile/numeric.mjs workload
      - name: Preserve sanitized allowlisted success or failure evidence
        id: evidence
        if: ${{ always() && steps.setup.outcome != 'skipped' }}
        timeout-minutes: 1
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          WORKLOAD_OUTCOME: ${{ steps.workload.outcome }}
        shell: bash
        run: node conformance/cel-profile/numeric.mjs evidence
      - name: Upload bounded qualification evidence only
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keir-numeric-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/keir-numeric-${{ github.run_id }}-${{ github.run_attempt }}/evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          archive: true
