name: Keir contract
on:
  push:
    branches: [main]
    paths:
      - compiler-java/**
      - runtime-java/**
      - runtime-node/**
      - schemas/**
      - scripts/check-keir-contracts.py
      - scripts/requirements-read2-contracts.txt
      - scripts/setup-node-example.mjs
      - scripts/setup-node-example.test.mjs
      - conformance/**
      - examples/**
      - docs/specs/**
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - .github/workflows/keir-contract.yml
  pull_request:
    paths:
      - compiler-java/**
      - runtime-java/**
      - runtime-node/**
      - schemas/**
      - scripts/check-keir-contracts.py
      - scripts/requirements-read2-contracts.txt
      - scripts/setup-node-example.mjs
      - scripts/setup-node-example.test.mjs
      - conformance/**
      - examples/**
      - docs/specs/**
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - .github/workflows/keir-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keir-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keir-contract:
    name: keir-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAVEN_USER_HOME: ${{ github.workspace }}/.tools/maven
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned schema-check dependency
        run: python -m pip install -r scripts/requirements-read2-contracts.txt
      - name: Check public Keir contracts
        run: python scripts/check-keir-contracts.py
      - uses: actions/cache@v6
        with:
          path: |
            .tools/maven
            .tools/npm-cache
          key: ${{ runner.os }}-keir-${{ hashFiles('pom.xml', 'compiler-java/pom.xml', 'runtime-java/pom.xml', 'examples/java-host/pom.xml', 'runtime-node/package-lock.json', 'examples/node-host/package-lock.json', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-keir-
      - name: Java regression and coverage
        env:
          KEIR_SCENARIO_PYTHON: python
        run: ./mvnw -B -ntp -Dmaven.repo.local=.tools/maven/repository -Pcoverage verify
      - name: Install pinned Node dependencies
        run: npm ci --prefix runtime-node --cache .tools/npm-cache --ignore-scripts --no-audit --no-fund
      - name: Node regression and coverage
        run: npm run --prefix runtime-node test:coverage
      - name: Pack and test the independent Node host
        env:
          KEIR_SCENARIO_PYTHON: python
        run: |
          node --test scripts/setup-node-example.test.mjs
          node scripts/setup-node-example.mjs
          mkdir -p .tools/node-packed
          tar -xzf .tools/packages/keir-runtime-node-0.4.0.tgz -C .tools/node-packed
          diff -r .tools/node-packed/package examples/node-host/node_modules/@keir/runtime-node
          diff -r runtime-node/src .tools/node-packed/package/src
          node --test examples/node-host/follow-up.test.mjs examples/node-host/verify-scenarios.test.mjs examples/node-host/decision-consumer.test.mjs examples/node-host/decision-host.test.mjs examples/node-host/pre-operation.test.mjs
      - name: Compare Java and Node old and current scenario results
        run: |
          java -jar compiler-java/target/keir-compiler-java-0.1.0-SNAPSHOT-cli.jar examples/node-host/follow-up/source.yaml examples/node-host/follow-up/dcm.json > .tools/teaching-artifact.json
          cmp conformance/keir-3/producers/0.4.0/artifact.json .tools/teaching-artifact.json
          # The installed-host Node verifier is deliberately fixed to the retained /2 corpus.
          for group in main zero after-write-read no-call handler title title-max title-composed; do
            java -jar examples/java-host/target/keir-java-host-0.1.0-SNAPSHOT.jar "$group" python conformance/keir-2 > .tools/java-scenarios.json
            node examples/node-host/verify-scenarios.mjs "$group" python > .tools/node-scenarios.json
            python -c 'import json; from pathlib import Path; assert json.loads(Path(".tools/java-scenarios.json").read_bytes()) == json.loads(Path(".tools/node-scenarios.json").read_bytes())'
          done
          node runtime-node/test/scenario-conformance.mjs python 3 > .tools/node-current-scenarios.json
          runtime_classpath="$(python -c 'from xml.etree import ElementTree; report = ElementTree.parse("runtime-java/target/surefire-reports/TEST-dev.keir.runtime.PublicScenarioTest.xml"); print(next(row.get("value") for row in report.findall("./properties/property") if row.get("name") == "java.class.path"))')"
          java -cp "$runtime_classpath" dev.keir.runtime.PublicScenarioDriver conformance/keir-3 > .tools/java-current-scenarios.json
          python -c 'import json; from pathlib import Path; normalize = lambda report: {**report, "scenarios": sorted(report["scenarios"], key=lambda row: (row["group"], row["id"])), "vectors": sorted(report["vectors"], key=lambda row: row["id"])}; java = json.loads(Path(".tools/java-current-scenarios.json").read_bytes()); node = json.loads(Path(".tools/node-current-scenarios.json").read_bytes()); assert len(java["scenarios"]) == len(node["scenarios"]) == 54; assert len(java["vectors"]) == len(node["vectors"]) == 51; assert normalize(java) == normalize(node)'
      - name: Bounded current-generation resource qualification
        shell: bash
        run: |
          mkdir -p build
          node conformance/resource-qualification/qualify.mjs | tee build/resource-qualification.json
          node conformance/resource-qualification/qualify.mjs --guarded-results | tee build/resource-guarded.json
      - name: Bounded current-generation concurrency qualification
        shell: bash
        run: node conformance/resource-qualification/qualify.mjs --concurrent | tee build/resource-concurrent.json
