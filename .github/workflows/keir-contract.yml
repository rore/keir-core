name: Keir contract
on:
  push:
    branches: [main]
    paths:
      - compiler-java/**
      - runtime-java/**
      - runtime-node/**
      - schemas/**
      - scripts/check-keir-contracts.py
      - scripts/requirements-read2-contracts.txt
      - conformance/**
      - examples/**
      - docs/specs/**
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - .github/workflows/keir-contract.yml
  pull_request:
    paths:
      - compiler-java/**
      - runtime-java/**
      - runtime-node/**
      - schemas/**
      - scripts/check-keir-contracts.py
      - scripts/requirements-read2-contracts.txt
      - conformance/**
      - examples/**
      - docs/specs/**
      - pom.xml
      - .mvn/**
      - mvnw
      - mvnw.cmd
      - .github/workflows/keir-contract.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keir-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keir-contract:
    name: keir-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAVEN_USER_HOME: ${{ github.workspace }}/.tools/maven
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned schema-check dependency
        run: python -m pip install -r scripts/requirements-read2-contracts.txt
      - name: Check public Keir contracts
        run: python scripts/check-keir-contracts.py
      - uses: actions/cache@v6
        with:
          path: |
            .tools/maven
            .tools/npm-cache
          key: ${{ runner.os }}-keir-${{ hashFiles('pom.xml', 'compiler-java/pom.xml', 'runtime-java/pom.xml', 'examples/java-host/pom.xml', 'runtime-node/package-lock.json', 'examples/node-host/package-lock.json', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-keir-
      - name: Java regression and coverage
        env:
          KEIR_SCENARIO_PYTHON: python
        run: ./mvnw -B -ntp -Dmaven.repo.local=.tools/maven/repository -Pcoverage verify
      - name: Install pinned Node dependencies
        run: npm ci --prefix runtime-node --cache .tools/npm-cache --ignore-scripts --no-audit --no-fund
      - name: Node regression and coverage
        run: npm run --prefix runtime-node test:coverage
      - name: Pack and test the independent Node host
        env:
          KEIR_SCENARIO_PYTHON: python
        run: |
          mkdir -p .tools/packages
          npm pack ./runtime-node --pack-destination .tools/packages --cache .tools/npm-cache --ignore-scripts
          npm ci --prefix examples/node-host --cache .tools/npm-cache --ignore-scripts --no-audit --no-fund
          mkdir -p .tools/node-packed
          tar -xzf .tools/packages/keir-runtime-node-0.0.0.tgz -C .tools/node-packed
          diff -r .tools/node-packed/package examples/node-host/node_modules/@keir/runtime-node
          node --test examples/node-host/follow-up.test.mjs examples/node-host/verify-scenarios.test.mjs
      - name: Compare packaged Java and Node scenario results
        run: |
          java -jar compiler-java/target/keir-compiler-java-0.1.0-SNAPSHOT-cli.jar examples/node-host/follow-up/source.yaml examples/node-host/follow-up/dcm.json > .tools/teaching-artifact.json
          cmp conformance/keir-1/artifact.json .tools/teaching-artifact.json
          for group in main zero after-write-read no-call handler title title-max title-composed; do
            java -jar examples/java-host/target/keir-java-host-0.1.0-SNAPSHOT.jar "$group" python > .tools/java-scenarios.json
            node examples/node-host/verify-scenarios.mjs "$group" python > .tools/node-scenarios.json
            python -c 'import json; from pathlib import Path; assert json.loads(Path(".tools/java-scenarios.json").read_bytes()) == json.loads(Path(".tools/node-scenarios.json").read_bytes())'
          done
